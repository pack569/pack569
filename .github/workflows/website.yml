# Pack 569 — the website's gates, and the only way the site is ever deployed.
#
#   push / pull_request   run the harness and build both targets. Nothing is deployed.
#   workflow_dispatch     the same gates, then a hand-started deploy of the chosen target to
#                         Cloudflare Pages. This is this workflow's ONLY deploy: a push or a
#                         merge never starts one (GitHub Pages still does, from main, until it
#                         is turned off at cutover step 6). Production is refused unless the
#                         run is from main, and then waits for the website-production reviewer
#                         to approve it. Staging waits for the website-staging reviewer.
#
# A preview is device-only: scripts/build-site.mjs writes FIREBASE_CONFIG and PACK_DOC_ID as
# null and its CSP allows no Google origin, so a preview cannot reach the live pack.
# Staging (staging.pack569.pages.dev, the one preview host Firebase lets sign in) is the build
# with BACKEND 'api' and STAGING true: its pack is on this site's own server, which Pages binds
# to pack569-preview for every branch but main, its CSP allows no Firestore host, and the page
# refuses the real move file. Sign-ins there are real Google sign-ins of the live Firebase
# project (see below), so it deploys through its own environment, website-staging, which
# needs a reviewer as production does.
# The deploy ships the artifact the gates built and checked; nothing is rebuilt after approval.
# It also ships functions/, the API, which reads and writes the pack in Cloudflare D1. What
# keeps a preview's API off the live pack is checked, not assumed: wrangler.toml gives the
# production deploy pack569-prod's id and every preview pack569-preview's, the harness and the
# deploy job below refuse a file where those ids are crossed, and at run time the API answers
# 503 unless the bound database's own `deployment` row matches the deploy (DEPLOY_ENV). What
# this does NOT separate is sign-in: previews and production accept the same Firebase
# project's Google accounts (docs/cloudflare-setup.md, "One Firebase project").
# Owner setup (Cloudflare project, token, secrets, environments): docs/cloudflare-setup.md.
#
# Every `uses:` is pinned to a full commit SHA. wrangler-action receives the Cloudflare token,
# and a moved tag must not be able to change what runs with it. Re-pin on purpose, not to a tag.
name: website

on:
  # No branch filter: every branch is gated, and a gate that only runs on main finds problems
  # after they have merged. A branch with an open PR runs twice; that is accepted.
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "preview = a throwaway pages.dev link, device-only, safe from any branch. staging = staging.pack569.pages.dev, sign-in and the preview database; only a branch you have read, needs approval. production = pack569.com, from main only, needs approval."
        type: choice
        options: [preview, staging, production]
        default: preview

permissions:
  contents: read

# Concurrency groups are repo-wide, hence the prefix. Push and PR runs share a group per ref,
# so a newer push cancels an older gate run. Each dispatch gets a group of its own (its run id),
# so a production run waiting for approval never blocks or cancels another dispatch, and is
# never cancelled by one. Deploys to the same target still queue one behind another through
# the deploy job's own group below.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('website-dispatch-{0}', github.run_id) || format('website-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  website-gates:
    name: Website gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Harness
        run: node test/harness.mjs

      # Every target, every run, so a change that breaks any build is caught on its branch
      # and not at deploy time. Each build re-verifies its own output before it exits.
      - name: Build preview, staging and production
        run: |
          node scripts/build-site.mjs --target preview --out _site-preview
          node scripts/build-site.mjs --target staging --out _site-staging
          node scripts/build-site.mjs --target production --out _site-production

      - name: Upload the site to deploy
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _site-${{ inputs.deploy_target }}
          if-no-files-found: error
          # Must outlast the approval wait: an approval given after the artifact expires
          # fails at download. Approve within a week, or run the workflow again.
          retention-days: 7

  deploy-preflight:
    name: Deploy preflight (${{ inputs.deploy_target }})
    needs: website-gates
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # to read the website-production and website-staging protection rules
    steps:
      # The branch guard lives here, in code, and FAILS rather than skips: a skipped job shows
      # grey and reads like nothing went wrong. `deploy` needs this job, so red here stops it.
      - name: Refuse production from a branch other than main
        if: inputs.deploy_target == 'production' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error title=Production deploys only from main::This run is from $REF. Pick main under 'Use workflow from', or deploy a preview instead."
          exit 1

      # GitHub creates an environment a job names if it does not exist yet, with NO protection
      # rules, so the first run would deploy without anyone approving it. Check that the
      # required reviewer is really there before the deploy job asks for the environment.
      # Production (website-production) and staging (website-staging) both need one: staging
      # is where real Google sign-ins meet a branch's code, and they work on the live pack too
      # (security review of stage C, item 5). Production must also be limited to chosen
      # branches; staging deploys whichever branch you have read, so it is not.
      - name: Refuse production or staging without a required reviewer
        if: inputs.deploy_target == 'production' || inputs.deploy_target == 'staging'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENV_NAME: ${{ inputs.deploy_target == 'production' && 'website-production' || 'website-staging' }}
        run: |
          set -uo pipefail
          if ! body=$(gh api "repos/$REPO/environments/$ENV_NAME" 2>/tmp/env.err); then
            echo "::error title=No $ENV_NAME environment::$(tr '\n' ' ' </tmp/env.err). Create it under Settings → Environments with a required reviewer (docs/cloudflare-setup.md) and run again."
            exit 1
          fi
          n=$(printf '%s' "$body" | jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error title=$ENV_NAME has no required reviewer::Add one under Settings → Environments → $ENV_NAME (docs/cloudflare-setup.md) and run again."
            exit 1
          fi
          if [ "$ENV_NAME" != "website-production" ]; then
            echo "$ENV_NAME requires a reviewer."
            exit 0
          fi
          # And production must be limited to chosen branches: with no policy, any branch may use it.
          if ! printf '%s' "$body" | jq -e '.deployment_branch_policy != null' >/dev/null; then
            echo "::error title=website-production allows every branch::Set Deployment branches to Selected branches → main under Settings → Environments → website-production (docs/cloudflare-setup.md) and run again."
            exit 1
          fi
          echo "website-production requires a reviewer and is limited to chosen branches."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download the site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site

      # A second check in a second job: exactly index.html + _headers, byte-for-byte this
      # commit's build for the chosen target, the CSP hash matching the script, and a preview
      # carrying none of the live config.
      - name: Verify the site
        env:
          TARGET: ${{ inputs.deploy_target }}
        run: node scripts/build-site.mjs --verify _site --target "$TARGET"

  deploy:
    name: Deploy to Cloudflare Pages (${{ inputs.deploy_target }})
    needs: [website-gates, deploy-preflight]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # The approval click (production and staging). Defence in depth: the branch guard and the
    # reviewer checks are the preflight above.
    environment:
      name: ${{ inputs.deploy_target == 'production' && 'website-production' || (inputs.deploy_target == 'staging' && 'website-staging' || 'website-preview') }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    # Never cancel a deploy in flight or waiting for approval; queue the next one behind it.
    concurrency:
      group: website-deploy-${{ inputs.deploy_target }}
      cancel-in-progress: false
    steps:
      # Not only for the script: `wrangler pages deploy` reads wrangler.toml from here.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download the site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site

      - name: Verify the site again
        env:
          TARGET: ${{ inputs.deploy_target }}
        run: node scripts/build-site.mjs --verify _site --target "$TARGET"

      # The API (functions/) talks to a D1 database named in wrangler.toml. Until the owner
      # has created the databases and pasted their ids in, the ids are REPLACE_WITH_…
      # placeholders, and a deploy would fail inside wrangler, or bind nothing. Say so here.
      # And the ids must pair up: the top level and [env.preview] carry the same id (the
      # preview database's), and neither is production's; DEPLOY_ENV is "preview" in both of
      # those and "prod" in [env.production]. A name is only a label; the id is what wrangler
      # binds. scripts/check-wrangler.mjs reads the file strictly (plain lines only: no quoted
      # keys, no multi-line strings that could hide a fake table), and the harness runs the
      # same script on every push. (The API checks the pairing again at run time, against the
      # database's own `deployment` row: functions/_lib/pack.js database().)
      - name: Refuse placeholder or crossed database ids
        run: node scripts/check-wrangler.mjs wrangler.toml

      # Deploy from a folder holding only the verified site, the API and wrangler.toml, so
      # wrangler cannot pick up anything else from the checkout. `wrangler pages deploy`
      # builds ./functions/ (next to wrangler.toml, not inside _site) into the site's server
      # code. The API is this commit's functions/, the same commit the gates tested; only
      # plain .js modules are allowed in it, so nothing else can ride along.
      - name: Stage the site and the API in a clean folder
        run: |
          set -eu
          stray=$(find functions -type f ! -name '*.js' | head -5)
          if [ -n "$stray" ]; then
            echo "::error title=Not a .js module in functions/::$stray — Pages would try to deploy it as server code."
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/deploy"
          mkdir -p "$RUNNER_TEMP/deploy"
          cp -R _site "$RUNNER_TEMP/deploy/_site"
          cp -R functions "$RUNNER_TEMP/deploy/functions"
          cp wrangler.toml "$RUNNER_TEMP/deploy/wrangler.toml"
          ls -la "$RUNNER_TEMP/deploy" "$RUNNER_TEMP/deploy/_site"
          find "$RUNNER_TEMP/deploy/functions" -type f | sort

      # Pages decides production by branch name: --branch=main goes to pack569.com (the
      # project's production branch) and binds [env.production]; anything else gets its own
      # pages.dev link and [env.preview]. --branch=staging is always staging.pack569.pages.dev,
      # the one preview host authorized for Google sign-in. Cloudflare shortens a long branch
      # name in the alias, so read the link from the summary below.
      # wranglerVersion is exact: npm installs it in this job, which holds the token.
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"
          workingDirectory: ${{ runner.temp }}/deploy
          command: >-
            pages deploy _site
            --project-name=pack569
            --branch=${{ inputs.deploy_target == 'production' && 'main' || (inputs.deploy_target == 'staging' && 'staging' || format('preview-{0}', github.sha)) }}

      - name: Write the link to the summary
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          TARGET: ${{ inputs.deploy_target }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning title=No deployment URL::wrangler returned no URL; the pages.dev address is in the Deploy step's log."
            echo "### Deployed ($TARGET), no URL returned; see the Deploy step's log" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::notice title=Website $TARGET deployed::$URL${ALIAS_URL:+ (alias: $ALIAS_URL)}"
          {
            echo "### Deployed ($TARGET)"
            echo ""
            echo "- Deployment: $URL"
            if [ -n "$ALIAS_URL" ]; then echo "- Alias: $ALIAS_URL"; fi
            echo ""
            if [ "$TARGET" = "preview" ]; then
              echo "Device-only: nothing it does reaches the live pack. Check DevTools → Network shows no"
              echo "firestore.googleapis.com, and the Console shows no Content-Security-Policy errors."
            elif [ "$TARGET" = "staging" ]; then
              echo "https://staging.pack569.pages.dev: sign-in works, and the pack lives in pack569-preview."
              echo "Made-up data only. Check DevTools → Network shows /api/ calls and no firestore.googleapis.com."
            else
              echo "Check sign-in and sync, and that /SETUP.md and /test/harness.mjs return the app page,"
              echo "not the file (with no 404.html, Pages answers every unknown path with index.html)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

# Pack 569 — Cloudflare Pages (Direct Upload).
#
# DIRECT UPLOAD, NOT GIT INTEGRATION, for two reasons:
#   1. A Git-connected Pages project with no build command serves the repo root as it is:
#      SETUP.md, the design docs, test/, .claude/ — everything GitHub Pages serves today.
#      Direct Upload sends only what scripts/build-site.mjs writes to _site/ (index.html and
#      _headers), so nothing else is ever on the site.
#   2. A Git integration deploys on every push. Here a deploy happens only when someone runs
#      the "website" workflow by hand (.github/workflows/website.yml), and production only
#      from main, after the website-production reviewer approves. Merging never deploys.
#
# pages_build_output_dir is what `wrangler pages deploy` uploads. Never point it at the repo.
# To build by hand:  node scripts/build-site.mjs --target preview
# Owner setup (account, project, token, secrets, DNS, databases): docs/cloudflare-setup.md.

name = "pack569"
pages_build_output_dir = "_site"
compatibility_date = "2026-09-28"

# ---- The API and its database (Phase 2) ------------------------------------------------------
#
# functions/ is the API: Pages Functions, deployed with the site by `wrangler pages deploy`
# from the folder that holds this file. It reads the pack from D1 through the binding DB.
#
# TWO DATABASES, AND A PREVIEW'S SERVER IS KEPT OFF THE LIVE ONE. (Sign-in is NOT separated:
# every environment accepts the same Firebase project's tokens; docs/cloudflare-setup.md,
# "One Firebase project".) Pages picks the environment by branch: --branch=main is production and gets [env.production]; every other branch (every
# preview-<sha> link, and staging) is a preview and gets [env.preview]. The top level is the
# same as [env.preview], and is what `wrangler pages dev` and the d1 commands read by default.
# Pages does not merge bindings or vars into an environment that sets its own, so each block
# below is complete on purpose.
#
# database_id: the owner pastes each database's id here after creating it
# (docs/cloudflare-setup.md, "The pack's database"). The deploy job refuses to run while any
# REPLACE_WITH_ placeholder is left.
#
# THE SAME ID TWICE, AND NEVER THE THIRD. The top-level database_id and [env.preview]'s must be
# the same (pack569-preview's), and neither may be production's. The harness and the deploy
# job both refuse a wrangler.toml where that does not hold: both run scripts/check-wrangler.mjs,
# which reads this file strictly. Every line is blank, a comment, one of the six table headers
# below, or a plain  key = "value"  (no quoted keys, no value over several lines, no comment
# after a value), so the file cannot say one thing to the check and another to wrangler.
# DEPLOY_ENV is checked where it sits, block by block. And the check does not stop at this
# file: each database carries a one-row `deployment` table saying which deployment it belongs
# to (migrations/0002_deployment.sql), seeded once by the owner, and the API answers 503 to
# everything when it does not match DEPLOY_ENV below.
#
# vars (read by functions/_lib/pack.js):
#   DEPLOY_ENV           "prod" in production, "preview" everywhere else. Must match the bound
#                        database's `deployment` row.
#   FIREBASE_PROJECT_ID  whose Google sign-ins the API accepts.
#   PACK_IDS             the packs this deployment serves: the id already printed in index.html
#                        (PACK_DOC_ID). Any other id is a 404; nobody starts a pack here.
#   OWNER_MODE           production: "fixed" — the owner is the account in the PACK_OWNER_UID
#                        secret, never whoever signs in first. Previews: "first-signer", so a
#                        test pack on the preview database can be claimed and tried out.
#                        The API treats DEPLOY_ENV "prod" as "fixed" whatever this says.
# The check pins these too: FIREBASE_PROJECT_ID "pack-569" in every block, OWNER_MODE "fixed"
# in production, and PACK_IDS the same in every block and equal to index.html's PACK_DOC_ID.
# PACK_OWNER_UID is a secret, not a var: it is set in the Cloudflare dashboard, never here.

[vars]
DEPLOY_ENV = "preview"
FIREBASE_PROJECT_ID = "pack-569"
PACK_IDS = "42391b9710be9ef3be1b7e84da4e0bf829318e277fdac2f12ba641d2acb665c0"
OWNER_MODE = "first-signer"

[[d1_databases]]
binding = "DB"
database_name = "pack569-preview"
database_id = "REPLACE_WITH_PACK569_PREVIEW_DATABASE_ID"
migrations_dir = "migrations"

[env.preview.vars]
DEPLOY_ENV = "preview"
FIREBASE_PROJECT_ID = "pack-569"
PACK_IDS = "42391b9710be9ef3be1b7e84da4e0bf829318e277fdac2f12ba641d2acb665c0"
OWNER_MODE = "first-signer"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "pack569-preview"
database_id = "REPLACE_WITH_PACK569_PREVIEW_DATABASE_ID"
migrations_dir = "migrations"

[env.production.vars]
DEPLOY_ENV = "prod"
FIREBASE_PROJECT_ID = "pack-569"
PACK_IDS = "42391b9710be9ef3be1b7e84da4e0bf829318e277fdac2f12ba641d2acb665c0"
OWNER_MODE = "fixed"

[[env.production.d1_databases]]
binding = "DB"
database_name = "pack569-prod"
database_id = "REPLACE_WITH_PACK569_PROD_DATABASE_ID"
migrations_dir = "migrations"
